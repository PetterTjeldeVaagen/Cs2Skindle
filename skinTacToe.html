<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skindle</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1577759186995249"
     crossorigin="anonymous"></script>
</head>
<body onload="start()">
    <div id="navBar">
        <ul class="navBar">
            <li ><a class="gameModeLink" href="skindle.html?freeplay">Freeplay</a></li>
            <li><a class="gameModeLink" href="skindle.html?daily">Daily challenge</a></li>
            <li><a class="gameModeLink" href="skinTacToe.html?skinGrid">Skin grid</a></li>
            <li><a class="gameModeLink" href="skinTacToe.html?skinTacToe">Skin-Tac-Toe</a></li>
            <li><a class="gameModeLink" href="how_to_play.html">How to play</a></li>
        </ul>
    </div>
    <h1 id="title"></h1>
    <div id="celebrationDiv">
        <p id="WinOrLossText"></p>
        <button id="restartButton" onclick="restart()">replay</button>
     </div>
    
    <div id="mainGrid">
        <div class="search-wrapper">
            <label>Search for a skin</label><br>
            <input type="search" placeholder="Skin search" id="searchBar">
            <ul id="SearchList">
                <li><button class="searchListElement" onclick="guess(0)"> </button></li>
                <li><button class="searchListElement" onclick="guess(1)"> </button> </li>
                <li><button class="searchListElement" onclick="guess(2)"> </button> </li>
                <li><button class="searchListElement" onclick="guess(3)"> </button></li>
                <li><button class="searchListElement" onclick="guess(4)"> </button></li>
                <li><button class="searchListElement" onclick="guess(5)"> </button></li>
                <li><button class="searchListElement" onclick="guess(6)"> </button> </li>
                <li><button class="searchListElement" onclick="guess(7)"> </button></li>
                <li><button class="searchListElement" onclick="guess(8)"> </button></li>
                <li><button class="searchListElement" onclick="guess(9)"> </button></li>
            </ul> 
            <br>
            <div id="pageSelector">
            <button class="pageArrow" onclick="changePage(-1)"> < </button>
            <p id="pageNumber"></p>
            <button class="pageArrow" onclick="changePage(1)"> > </button>
            </div>
        </div>


        <div id="scoreAndPlayingboard">
            <div id="timeSetterAndStartButton">
                <div id="timerForm">
                    <label style="color: white; font-size: 1.5rem;">
                        Time limit:
                    </label>

                    <label class="radio-btn">
                        <input type="radio" name="timer" value="60">
                        <span>60 sec</span>
                    </label>

                    <label class="radio-btn">
                        <input type="radio" name="timer" value="30" checked>
                        <span>30 sec</span>
                    </label>

                    <label class="radio-btn">
                        <input type="radio" name="timer" value="20">
                        <span>20 sec</span>
                    </label>

                    <label class="radio-btn">
                        <input type="radio" name="timer" value="10">
                        <span>10 sec</span>
                    </label>
                </div>
            </div>

            <div id="scoreboard">
                <div id="player1scoreDiv">
                    <p id="player1score"></p>
                    <p>Player 1</p>
                </div>

                <div id="player2scoreDiv">
                    <p id="player2score"></p>
                    <p>Player 2</p>
                </div>

                <div id="skinTacToeTimer">
                    <p id="playersTurnText"></p>
                    
                    <p id="timerText">Time remaining: 0</p>
                </div>

                <button id="startButton" onclick="startMultiplayer()">Start game</button>
            </div>

            <div class="skinTacToeBoard">
                <table>
                    <tr>
                        <td>Skin-Tac-Toe</td>
                        <td id="tileA"></td>
                        <td id="tileB"></td>
                        <td id="tileC"></td>
                    </tr>
                    <tr>
                        <td id="tile1"></td>
                        <td><button class="skinGridButtons" id="tile1A" style="display:none" onclick="choose(this)">+</button></td>
                        <td><button class="skinGridButtons" id="tile1B" style="display:none" onclick="choose(this)">+</button></td>
                        <td><button class="skinGridButtons" id="tile1C" style="display:none" onclick="choose(this)">+</button></td>
                    </tr>
                    <tr>
                        <td id="tile2"></td>
                        <td><button class="skinGridButtons" id="tile2A" style="display:none" onclick="choose(this)">+</button></td>
                        <td><button class="skinGridButtons" id="tile2B" style="display:none" onclick="choose(this)">+</button></td>
                        <td><button class="skinGridButtons" id="tile2C" style="display:none" onclick="choose(this)">+</button></td>
                    </tr>
                    <tr>
                        <td id="tile3"></td>
                        <td><button class="skinGridButtons" id="tile3A" style="display:none" onclick="choose(this)">+</button></td>
                        <td><button class="skinGridButtons" id="tile3B" style="display:none" onclick="choose(this)">+</button></td>
                        <td><button class="skinGridButtons" id="tile3C" style="display:none" onclick="choose(this)">+</button></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>
<script data-goatcounter="https://csskindle.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script src="skinTacToe.js" type="text/javascript"></script>
<script src="skins.js" type="text/javascript"></script>
<script src="shared.js" type="text/javascript"></script>
</html>
